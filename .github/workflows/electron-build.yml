name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*' # Trigger workflow only on version tags (e.g., v1.0.0)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: electron-app/frontend
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        working-directory: electron-app/frontend
        run: npm run build

      - name: Install Electron App Dependencies
        working-directory: electron-app
        run: npm install --legacy-peer-deps

      - name: Build Electron App
        working-directory: electron-app
        run: npm run dist -- -p never

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: electron-app/dist/*.exe
          retention-days: 7

      - name: Upload Mac Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: electron-app/dist/*.dmg
          retention-days: 7

  deploy:
    name: Deploy to VPS & GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: ./downloads

      - name: Download Mac Artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-app
          path: ./downloads

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "./downloads/*"
          target: "/var/www/downloads"
          strip_components: 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./downloads/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
